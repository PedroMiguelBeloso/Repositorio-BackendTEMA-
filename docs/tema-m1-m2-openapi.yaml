      description: Calidad y Mejora Continua no se asigna a servicios en esta entrega. Se rechazan versiones
        no publicadas y dos versiones diferentes del mismo proceso. Los ID de fuente deben ser accesibles
        para la identidad técnica.
    VerifiableProcess:
      type: object
      properties:
        processVersionId:
          type: string
          format: uuid
        processName:
          type: string
        officialVersion:
          type: string
        macroActivities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
            required:
            - id
            - name
      required:
      - processVersionId
      - processName
      - officialVersion
      - macroActivities
    VerificationTarget:
      type: object
      properties:
        serviceId:
          type: string
          format: uuid
        processVersionId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/VerificationScope'
        macroActivityId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 1000
      required:
      - serviceId
      - processVersionId
      - scope
      description: macroActivityId obligatorio solo si scope=MACRO_ACTIVITY; prohibido si scope=PROCESS. La
        versión debe estar publicada, asignada al servicio y habilitada en M2.
    TicketSelectionGroup:
      type: object
      properties:
        id:
          type: string
        macroActivityId:
          type: string
          format: uuid
        label:
          type: string
        cardinality:
          $ref: '#/components/schemas/Cardinality'
        inputExpectationIds:
          type: array
          maxItems: 1
          description: La entrada TICKET de la macroactividad, cuando exista. MULTIPLE se configura en la
            cardinalidad de esa única entrada y no creando varias entradas iguales.
          items:
            type: string
            format: uuid
        relatedExpectationIds:
          type: array
          description: Expectativas que usan los tickets seleccionados. Incluye controles TICKET y puede
            incluir una evidencia no TICKET cuya aplicabilidad depende del ticket, como Orden de transporte.
          items:
            type: string
            format: uuid
        required:
          type: boolean
      required:
      - id
      - macroActivityId
      - label
      - cardinality
      - inputExpectationIds
      - relatedExpectationIds
      - required
      description: >-
        Regla del MVP: un grupo de selección de tickets por macroactividad incluida en el alcance.
        Si existe una entrada TICKET, su cardinalidad determina el selector; ONE exige exactamente un ID y
        MULTIPLE admite uno o más. Los registros y salidas TICKET de la misma macroactividad reutilizan los
        IDs elegidos y aparecen en relatedExpectationIds, sin pedirlos de nuevo. Una evidencia documental
        puede figurar en ese grupo solo para recibir contexto de aplicabilidad; se evalúa una vez a nivel
        del servicio y no se exige un documento por ticket. Si no existe entrada TICKET
        pero sí registros o salidas TICKET, se crea igualmente un grupo usando su cantidad configurada.
        El borrador no se publica si contiene dos entradas TICKET distintas o cardinalidades TICKET
        diferentes dentro de una misma macroactividad. No se
        admiten dos conjuntos independientes de tickets dentro de una macroactividad en este MVP. El
        frontend utiliza id y relatedExpectationIds devueltos por preview; no infiere relaciones por nombre.
    PreviewExpectation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        macroActivityId:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        location:
          $ref: '#/components/schemas/EvidenceLocation'
        displayName:
          type: string
        evidenceType:
          $ref: '#/components/schemas/EvidenceType'
        applicability:
          $ref: '#/components/schemas/ApplicabilityMode'
        cardinality:
          $ref: '#/components/schemas/Cardinality'
        ticketSelectionGroupId:
          type: string
          description: ID del grupo de tickets devuelto por preview cuyos IDs se usan para esta expectativa.
            También puede aparecer en una evidencia no TICKET cuando su aplicabilidad requiere el contexto
            de los tickets seleccionados; por ejemplo, Orden de transporte.
      required:
      - id
      - macroActivityId
      - location
      - displayName
      - evidenceType
      - applicability
      - cardinality
    VerificationPreview:
      type: object
      properties:
        serviceId:
          type: string
          format: uuid
        serviceRevision:
          type: integer
        processVersionId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/VerificationScope'
        macroActivityId:
          type: string
          format: uuid
        expectations:
          type: array
          items:
            $ref: '#/components/schemas/PreviewExpectation'
        ticketSelectionGroups:
          type: array
          items:
            $ref: '#/components/schemas/TicketSelectionGroup'
      required:
      - serviceId
      - serviceRevision
      - processVersionId
      - scope
      - expectations
      - ticketSelectionGroups
    TicketSelection:
      type: object
      properties:
        groupId:
          type: string
        ticketIds:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
      required:
      - groupId
      - ticketIds
    StartVerificationRequest:
      type: object
      properties:
        serviceId:
          type: string
          format: uuid
        serviceRevision:
          type: integer
          minimum: 0
        processVersionId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/VerificationScope'
        macroActivityId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 1000
        ticketSelections:
          type: array
          items:
            $ref: '#/components/schemas/TicketSelection'
      required:
      - serviceId
      - serviceRevision
      - processVersionId
      - scope
      - ticketSelections
      description: Se envían exactamente los grupos devueltos por preview que requieren selección. ONE exige
        1 ID; MULTIPLE 1 o más. Backend vuelve a validar grupo, pertenencia al proyecto y revisión del servicio.
    RunProgress:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        processed:
          type: integer
          minimum: 0
        reviewRequired:
          type: integer
          minimum: 0
      required:
      - total
      - processed
      - reviewRequired
    VerificationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        serviceNameSnapshot:
          type: string
          description: Nombre del servicio al iniciar la ejecución; permanece estable en el historial.
        serviceTypeSnapshot:
          $ref: '#/components/schemas/ServiceType'
        serviceRevisionSnapshot:
          type: integer
          minimum: 0
          description: Revisión del servicio leída al crear esta ejecución; no cambia si el servicio se edita luego.
        processVersionId:
          type: string
          format: uuid
        processNameSnapshot:
          type: string
          description: Nombre del proceso al iniciar la ejecución.
        processOfficialVersionSnapshot:
          type: string
          description: Versión oficial del proceso utilizada.
        sourceSnapshot:
          $ref: '#/components/schemas/ServiceSource'
        scope:
          $ref: '#/components/schemas/VerificationScope'
        macroActivityId:
          type: string
          format: uuid
        macroActivityNameSnapshot:
          type: string
          description: Nombre histórico de la macroactividad cuando el alcance es MACRO_ACTIVITY.
        note:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        progress:
          $ref: '#/components/schemas/RunProgress'
        startedBy:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        failureMessage:
          type: string
        ticketSelections:
          type: array
          items:
            $ref: '#/components/schemas/TicketSelection'
      required:
      - id
      - serviceId
      - serviceNameSnapshot
      - serviceTypeSnapshot
      - serviceRevisionSnapshot
      - processVersionId
      - processNameSnapshot
      - processOfficialVersionSnapshot
      - sourceSnapshot
      - scope
      - status
      - progress
      - startedBy
      - startedAt
      - ticketSelections
      description: Una ejecución nueva nunca modifica resultados de ejecuciones anteriores. Conserva tipo y
        revisión del servicio, fuentes y versión del proceso utilizados; no hay comparación ni reverificación
        especial. serviceRevisionSnapshot debe coincidir con serviceRevision recibido al iniciar la ejecución.
    EvidenceReference:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/EvidenceType'
        source:
          $ref: '#/components/schemas/SourceType'
        externalId:
          type: string
        displayName:
          type: string
        webUrl:
          type: string
          format: uri
        observedAt:
          type: string
          format: date-time
        ticketId:
          type: string
      required:
      - kind
      - source
      - externalId
      - displayName
      - observedAt
      description: Referencia y metadatos de la evidencia; nunca contenido documental, adjuntos de Redmine
        o credenciales.
    ApplicabilityAssessment:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/ApplicabilityDecision'
        origin:
          $ref: '#/components/schemas/DecisionOrigin'
        rationale:
          type: string
        limitations:
          type: array
          items:
            type: string
      required:
      - decision
      - origin
      - rationale
      - limitations
    HumanDecisionEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        decisionType:
          $ref: '#/components/schemas/HumanDecisionType'
        applicabilityDecision:
          $ref: '#/components/schemas/HumanApplicabilityDecision'
        finalStatus:
          $ref: '#/components/schemas/ResultStatus'
        rationale:
          type: string
        decidedBy:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
      required:
      - id
      - decisionType
      - rationale
      - decidedBy
      - decidedAt
      description: Evento inmutable. APPLICABILITY exige applicabilityDecision y omite finalStatus;
        RESULT_STATUS exige finalStatus y omite applicabilityDecision. Los eventos se devuelven del más
        antiguo al más reciente; una corrección agrega un evento nuevo.
    VerificationResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        expectationId:
          type: string
          format: uuid
        macroActivityId:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        displayName:
          type: string
        evidenceType:
          $ref: '#/components/schemas/EvidenceType'
        location:
          $ref: '#/components/schemas/EvidenceLocation'
        subjectTicketId:
          type: string
          description: Si la expectativa de tipo TICKET se evalúa por varios tickets, se crea un resultado
            independiente por cada uno. Una evidencia documental por servicio, aunque use contexto de tickets
            para decidir aplicabilidad, omite este campo y produce un solo resultado.
        applicability:
          $ref: '#/components/schemas/ApplicabilityAssessment'
        proposedStatus:
          $ref: '#/components/schemas/ResultStatus'
        effectiveStatus:
          $ref: '#/components/schemas/ResultStatus'
        rationale:
          type: string
        limitations:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceReference'
        humanDecisions:
          type: array
          items:
            $ref: '#/components/schemas/HumanDecisionEvent'
          description: Historial de decisiones humanas de aplicabilidad y de estado final; vacío si no hubo ninguna.
        revision:
          type: integer
          minimum: 0
      required:
      - id
      - runId
      - expectationId
      - macroActivityId
      - displayName
      - evidenceType
      - location
      - applicability
      - proposedStatus
      - effectiveStatus
      - rationale
      - limitations
      - evidence
      - humanDecisions
      - revision
      description: Un resultado por uso de evidencia; para controles de Ticket sobre selección múltiple, un
        resultado por ticket. Una evidencia documental por servicio se evalúa una vez, aunque se reutilice
        su referencia.
    ResolveApplicabilityRequest:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        decision:
          $ref: '#/components/schemas/HumanApplicabilityDecision'
        rationale:
          type: string
          minLength: 1
      required:
      - revision
      - decision
      - rationale
      description: Solo ADMIN, run COMPLETED y expectativa CASE_DEPENDENT con aplicabilidad UNDETERMINED. APPLIES
        reintenta la comprobación de esa evidencia; falla de fuente produce REVIEW_REQUIRED.
    DecideResultRequest:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        finalStatus:
          $ref: '#/components/schemas/ResultStatus'
        rationale:
          type: string
          minLength: 1
      required:
      - revision
      - finalStatus
      - rationale
      description: Confirma o corrige el resultado con fundamento y auditoría. NOT_APPLICABLE solo si la expectativa
        es CASE_DEPENDENT y su aplicabilidad fue resuelta como NOT_APPLICABLE.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido por /auth/login. No contiene credenciales de Drive/Redmine.
  parameters:
    processId:
      name: processId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    serviceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    resultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
