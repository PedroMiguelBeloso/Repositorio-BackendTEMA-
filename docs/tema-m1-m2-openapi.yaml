      description: Reemplazo completo y atómico del borrador. IDs omitidos crean elementos; IDs anteriores
        omitidos se eliminan. Solo DRAFT. revision controla ediciones concurrentes. En este MVP cada
        macroactividad admite como máximo una entrada TICKET; ONE/MULTIPLE de esa entrada define la cantidad
        solicitada al verificar. Si no hay entrada TICKET pero sí un registro o salida TICKET, el backend
        presenta igualmente un selector para esa macroactividad.
