spring.application.name=agente-iso
spring.mvc.problemdetails.enabled=true

# Runtime secrets/configuration come from the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:*}

tema.security.jwt.secret-base64=${TEMA_JWT_SECRET_BASE64}
tema.security.jwt.ttl=${TEMA_JWT_TTL:PT2H}
tema.security.bootstrap-admin.enabled=${TEMA_BOOTSTRAP_ADMIN_ENABLED:false}
tema.security.bootstrap-admin.email=${TEMA_BOOTSTRAP_ADMIN_EMAIL:}
tema.security.bootstrap-admin.password=${TEMA_BOOTSTRAP_ADMIN_PASSWORD:}
tema.security.bootstrap-admin.display-name=${TEMA_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrador}

# Maximum duration of each read-only Drive/Redmine availability check.
tema.integrations.probe-timeout=${TEMA_INTEGRATION_PROBE_TIMEOUT:PT3S}

# Redmine reads only project metadata and issues. API key is sent in X-Redmine-API-Key.
tema.redmine.enabled=${TEMA_REDMINE_ENABLED:false}
tema.redmine.api-base-url=${TEMA_REDMINE_API_BASE_URL:http://localhost:8080/redmine}
tema.redmine.api-key=${TEMA_REDMINE_API_KEY:}
tema.redmine.timeout=${TEMA_REDMINE_TIMEOUT:PT5S}

# Drive reads metadata only. Credentials use Application Default Credentials.
tema.drive.enabled=${TEMA_DRIVE_ENABLED:false}
tema.drive.api-base-url=${TEMA_DRIVE_API_BASE_URL:https://www.googleapis.com/drive/v3}
tema.drive.timeout=${TEMA_DRIVE_TIMEOUT:PT5S}

management.endpoints.web.exposure.include=health,info

# A single worker processes verification runs; excess starts fail when this queue is full.
tema.verification.queue-capacity=${TEMA_VERIFICATION_QUEUE_CAPACITY:10}

# OpenAI is used only for case-dependent applicability that needs interpretation.
# The backend starts without an API key; such assessments remain undetermined.
tema.openai.enabled=${TEMA_OPENAI_ENABLED:false}
tema.openai.api-key=${OPENAI_API_KEY:}
tema.openai.model=${TEMA_OPENAI_MODEL:}
tema.openai.timeout=${TEMA_OPENAI_TIMEOUT:PT20S}
