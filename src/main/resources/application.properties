spring.application.name=agente-iso
spring.mvc.problemdetails.enabled=true

# Runtime secrets/configuration come from the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:*}

tema.security.jwt.secret-base64=${TEMA_JWT_SECRET_BASE64}
tema.security.jwt.ttl=${TEMA_JWT_TTL:PT2H}
tema.security.bootstrap-admin.enabled=${TEMA_BOOTSTRAP_ADMIN_ENABLED:false}
tema.security.bootstrap-admin.email=${TEMA_BOOTSTRAP_ADMIN_EMAIL:}
tema.security.bootstrap-admin.password=${TEMA_BOOTSTRAP_ADMIN_PASSWORD:}
tema.security.bootstrap-admin.display-name=${TEMA_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrador}

# Maximum duration of each read-only Drive/Redmine availability check.
tema.integrations.probe-timeout=${TEMA_INTEGRATION_PROBE_TIMEOUT:PT3S}

# Drive reads metadata only. Credentials use Application Default Credentials.
tema.drive.enabled=${TEMA_DRIVE_ENABLED:false}
tema.drive.api-base-url=${TEMA_DRIVE_API_BASE_URL:https://www.googleapis.com/drive/v3}
tema.drive.timeout=${TEMA_DRIVE_TIMEOUT:PT5S}

management.endpoints.web.exposure.include=health,info
